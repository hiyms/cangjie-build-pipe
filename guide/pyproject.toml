[project]
name = "cangjie-guide"
version = "0.1.0"
description = "Local CLI/TUI that drives the Cangjie SDK build and test workflows through the gh CLI."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "cangjie-build contributors" }]
dependencies = [
    "typer>=0.25,<1.0",
    "rich>=15.0,<16",
    "pyyaml>=6.0,<7.0",
    "questionary>=2.0,<3.0",
]

[project.scripts]
cangjie-guide = "cangjie_guide.cli:entrypoint"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cangjie_guide"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "ty>=0.0.1a13",
    "pyright>=1.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.environment]
python-version = "3.11"

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__", ".venv"]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
