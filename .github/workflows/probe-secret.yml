name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - env:
          CS: ${{ secrets.SCCACHE_AZURE_CONNECTION_STRING }}
        run: |
          python3 -c "
          import os
          cs = os.environ['CS']
          keys = [p.split('=')[0] for p in cs.split(';') if p]
          print('keys:', keys)
          print('has BlobEndpoint:', 'BlobEndpoint' in cs)
          print('trailing semicolon:', cs.endswith(';'))
          be = [p for p in cs.split(';') if p.startswith('BlobEndpoint')]
          print('blobendpoint value:', be[0].split('=',1)[1] if be else None)
          "
