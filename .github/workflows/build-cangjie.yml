name: Build Cangjie SDK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version baked into the SDK and its artifact names, without a leading v (e.g. 1.0.2). Leave empty to derive it from tag."
        required: false
        default: ""
      tag:
        description: "Global tag/branch applied to all four upstream repos (default = main)."
        required: false
        default: "main"
      build_type:
        description: "Build type."
        required: true
        default: "relwithdebinfo"
        type: choice
        options:
          - release
          - debug
          - relwithdebinfo
      compiler_source:
        description: "Override compiler source: the clone URL, optionally followed by :ref (a branch with slashes is fine). Leaving it empty uses the default branch, or tag for the ref."
        required: false
        default: ""
      runtime_source:
        description: "Override runtime source: same form as compiler_source."
        required: false
        default: ""
      tools_source:
        description: "Override tools source: same form as compiler_source."
        required: false
        default: ""
      stdx_source:
        description: "Override stdx source: same form as compiler_source."
        required: false
        default: ""
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read
  actions: write   # required by sccache GHA cache backend

defaults:
  run:
    shell: bash

jobs:
  lint-and-test:
    name: Lint & test (Python harness)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Install dev dependencies
        run: uv sync --frozen

      - name: Install shell tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.11.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Shell lint
        run: shellcheck .github/scripts/*.sh

      - name: Shell format
        run: shfmt -d .github/scripts

      - name: ty
        run: uv run ty check

      - name: Pyright
        run: uv run pyright

      - name: Pytest
        run: uv run pytest

  build-sdk:
    name: Build SDK (${{ matrix.target }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        target:
          - linux-x64
          - windows-x64

    env:
      CANGJIE_WORKSPACE: ${{ github.workspace }}/workspace
      CANGJIE_BUILD_ROOT: ${{ github.workspace }}/buildtools
      # Multi-level sccache: disk (L0, intra-job) + GitHub Actions cache (L1, inter-job).
      # See https://github.com/mozilla/sccache/blob/main/docs/MultiLevel.md
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_MULTILEVEL_CHAIN: "disk,gha"
      SCCACHE_MULTILEVEL_WRITE_ERROR_POLICY: "l0"
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: "5G"

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Install Python harness dependencies
        run: uv sync --frozen

      - name: Install Ubuntu system packages
        run: uv run cangjie-build install-system-deps

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Compute toolchain cache key
        id: tc-key
        run: |
          set -euo pipefail
          # Opaque cache key here, not a filename: the script's .tar.gz suffix
          # belongs to the blob path the Azure workflows use.
          echo "key=$(.github/scripts/toolchain-cache-key.sh ${{ matrix.target }})" >> "$GITHUB_OUTPUT"
          if [[ "${{ matrix.target }}" == "windows-x64" ]]; then
            echo "path=${{ env.CANGJIE_BUILD_ROOT }}/llvm-mingw-w64" >> "$GITHUB_OUTPUT"
          else
            echo "path=${{ env.CANGJIE_BUILD_ROOT }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore toolchain cache
        id: tc-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.tc-key.outputs.path }}
          key: ${{ steps.tc-key.outputs.key }}

      - name: Build static libs (linux-x64)
        if: matrix.target == 'linux-x64' && steps.tc-cache.outputs.cache-hit != 'true'
        run: uv run cangjie-build --target ${{ matrix.target }} install-static-libs

      - name: Build MinGW toolchain (windows-x64)
        if: matrix.target == 'windows-x64' && steps.tc-cache.outputs.cache-hit != 'true'
        # mingw.py passes -DLLVM_USE_LINKER=lld for the host LLVM bootstrap
        # when apt's 'lld' package is installed (it is — see system_deps.py).
        run: uv run cangjie-build --target ${{ matrix.target }} install-mingw

      # Save the toolchain cache as soon as it's built — independent of
      # whether subsequent build stages succeed. Without this, a Cangjie
      # compile failure later would lose the 30-60 min of toolchain work.
      - name: Save toolchain cache
        if: always() && steps.tc-cache.outputs.cache-hit != 'true' && hashFiles(format('{0}/**', steps.tc-key.outputs.path)) != ''
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.tc-key.outputs.path }}
          key: ${{ steps.tc-key.outputs.key }}

      - name: Resolve effective Cangjie version
        id: cjver
        # Defer the normalisation to cangjie-build's print-version subcommand
        # so the artifact-name glob below uses the exact same SemVer the
        # Python harness will bake into the produced filenames (no drift
        # between shell-side and Python-side rules). An empty version input
        # leaves the tag as the version source, which is the pre-version
        # behaviour.
        env:
          VERSION: ${{ inputs.version }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version_source=${VERSION:-$TAG}
          value=$(uv run cangjie-build --cangjie-version "$version_source" print-version)
          # An explicitly requested version must survive normalisation untouched.
          # The harness strips a leading v and replaces non-SemVer input with its
          # dev placeholder, which would publish an artifact under a different
          # version than the one asked for.
          if [[ -n "$VERSION" && "$value" != "$VERSION" ]]; then
            echo "::error::version '$VERSION' normalises to '$value'; pass MAJOR.MINOR.PATCH without a leading v"
            exit 1
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Fetch Cangjie source repositories
        env:
          TAG: ${{ inputs.tag }}
          COMPILER_SOURCE: ${{ inputs.compiler_source }}
          RUNTIME_SOURCE: ${{ inputs.runtime_source }}
          TOOLS_SOURCE: ${{ inputs.tools_source }}
          STDX_SOURCE: ${{ inputs.stdx_source }}
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$TAG" ]]; then args+=(--tag "$TAG"); fi
          mapfile -t override_args < <(.github/scripts/build-fetch-args.sh)
          args+=("${override_args[@]}")
          uv run cangjie-build \
            --target ${{ matrix.target }} \
            --build-type ${{ inputs.build_type }} \
            --cangjie-version "${{ steps.cjver.outputs.value }}" \
            fetch "${args[@]}"

      # Stages are split into separate steps so each gets its own log group
      # in the GH Actions UI — a single combined log for all five stages
      # crosses the size threshold where the live-log viewer fails to load.
      - name: Build compiler
        run: |
          uv run cangjie-build \
            --target ${{ matrix.target }} \
            --build-type ${{ inputs.build_type }} \
            --cangjie-version "${{ steps.cjver.outputs.value }}" \
            build compiler

      - name: Build runtime
        run: |
          uv run cangjie-build \
            --target ${{ matrix.target }} \
            --build-type ${{ inputs.build_type }} \
            --cangjie-version "${{ steps.cjver.outputs.value }}" \
            build runtime

      - name: Build stdlib
        run: |
          uv run cangjie-build \
            --target ${{ matrix.target }} \
            --build-type ${{ inputs.build_type }} \
            --cangjie-version "${{ steps.cjver.outputs.value }}" \
            build stdlib

      - name: Build stdx
        run: |
          uv run cangjie-build \
            --target ${{ matrix.target }} \
            --build-type ${{ inputs.build_type }} \
            --cangjie-version "${{ steps.cjver.outputs.value }}" \
            build stdx

      - name: Build tools
        run: |
          uv run cangjie-build \
            --target ${{ matrix.target }} \
            --build-type ${{ inputs.build_type }} \
            --cangjie-version "${{ steps.cjver.outputs.value }}" \
            build tools

      - name: Package SDK
        run: |
          uv run cangjie-build \
            --target ${{ matrix.target }} \
            --build-type ${{ inputs.build_type }} \
            --cangjie-version "${{ steps.cjver.outputs.value }}" \
            package

      - name: Verify SDK
        run: |
          uv run cangjie-build \
            --target ${{ matrix.target }} \
            --build-type ${{ inputs.build_type }} \
            --cangjie-version "${{ steps.cjver.outputs.value }}" \
            verify

      - name: Upload SDK + STDX artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cangjie-${{ matrix.target }}-${{ steps.cjver.outputs.value }}
          path: ${{ env.CANGJIE_WORKSPACE }}/software/cangjie-*-${{ matrix.target }}-${{ steps.cjver.outputs.value }}*.*
          if-no-files-found: error
