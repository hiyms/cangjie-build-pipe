name: Reap orphan cloud resources

# Safety net for the Azure VM workflows: if a run gets cancelled before its
# cleanup job executes, the VM keeps billing forever. This sweep runs hourly and
# deletes stale cangjie-* Azure resource groups.
#
# Azure only: the GCP runner workflow was dropped, so there is nothing to reap
# there and the GCP credentials are no longer required.

on:
  schedule:
    - cron: "17 * * * *"      # hourly at :17
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

defaults:
  run:
    shell: bash

jobs:
  reap-azure:
    name: Reap orphan Azure RGs
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Reap orphan RGs
        env:
          # Must exceed the longest job that can still be running, otherwise the
          # sweep deletes a live run's resource group mid-flight. The longest is
          # the test workflow: provision + 5h test budget.
          MAX_AGE_HOURS: "8"
        run: .github/scripts/azure-reap-orphans.sh
